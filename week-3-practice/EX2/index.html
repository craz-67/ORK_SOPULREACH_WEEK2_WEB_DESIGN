<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
      }
  
      .main {
        height: 100vh;
        background: #25384B;
        display: grid;
        grid-template-columns: 1fr 40em;
        padding: 0 4em;
        gap: 5em;
      }

      .left-section {
        background: #A3CFCC;
        flex-grow: 1;
      }

      .right-section {
        background: #F7CFB6;
        display: grid;
        grid-template-rows: 1fr 1fr 1fr;
        padding: 2em;
        gap: 2em;
        align-items: center;
      }

      .item {
        background: #86C2DE;
        height: 250px;
      }
 
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
